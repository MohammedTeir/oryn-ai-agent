name: Production-signed shell build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oryn-production-shell-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signing-readiness:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        name: Check whether signing secrets are configured
        env:
          ORYN_RELEASE_KEYSTORE_B64: ${{ secrets.ORYN_RELEASE_KEYSTORE_B64 }}
          ORYN_RELEASE_KEY_ALIAS: ${{ secrets.ORYN_RELEASE_KEY_ALIAS }}
          ORYN_RELEASE_STORE_PASSWORD: ${{ secrets.ORYN_RELEASE_STORE_PASSWORD }}
          ORYN_RELEASE_KEY_PASSWORD: ${{ secrets.ORYN_RELEASE_KEY_PASSWORD }}
          ORYN_RELEASE_CERT_SHA256: ${{ secrets.ORYN_RELEASE_CERT_SHA256 }}
        run: |
          set +x
          if [[ -n "$ORYN_RELEASE_KEYSTORE_B64" && -n "$ORYN_RELEASE_KEY_ALIAS" && -n "$ORYN_RELEASE_STORE_PASSWORD" && -n "$ORYN_RELEASE_KEY_PASSWORD" && -n "$ORYN_RELEASE_CERT_SHA256" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Production signing is not configured; build skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi
  build:
    needs: signing-readiness
    if: ${{ github.ref == 'refs/heads/main' && needs.signing-readiness.outputs.ready == 'true' }}
    name: Build and verify production-signed shell
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: spikes/android-feasibility
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
      ORYN_ANDROID_VERSION_CODE: ${{ github.run_number }}
      ORYN_GRADLE_MAX_WORKERS: '2'
      ORYN_GRADLE_JVM_ARGS: -Xmx3g -XX:MaxMetaspaceSize=768m
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure temporary caches
        run: |
          printf 'GRADLE_USER_HOME=%s/oryn-gradle\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'ANDROID_USER_HOME=%s/oryn-android\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: spikes/android-feasibility/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - name: Set up Android
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK components
        run: sdkmanager --install 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Cache Gradle dependencies and build outputs
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Install and validate dependencies
        run: |
          npm ci --no-audit --no-fund
          npx --no-install expo install --check
          npm run lint
          npm run typecheck
          npm test
      - name: Build unsigned shell without release secrets
        run: bash scripts/build-production-unsigned.sh
      - name: Sign and verify with the release key
        env:
          ORYN_RELEASE_KEYSTORE_B64: ${{ secrets.ORYN_RELEASE_KEYSTORE_B64 }}
          ORYN_RELEASE_KEY_ALIAS: ${{ secrets.ORYN_RELEASE_KEY_ALIAS }}
          ORYN_RELEASE_STORE_PASSWORD: ${{ secrets.ORYN_RELEASE_STORE_PASSWORD }}
          ORYN_RELEASE_KEY_PASSWORD: ${{ secrets.ORYN_RELEASE_KEY_PASSWORD }}
          ORYN_RELEASE_CERT_SHA256: ${{ secrets.ORYN_RELEASE_CERT_SHA256 }}
        run: |
          set +x
          umask 077
          : "${ORYN_RELEASE_KEYSTORE_B64:?Release keystore secret missing}"
          export ORYN_RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/oryn-release.keystore"
          trap 'rm -f "$ORYN_RELEASE_KEYSTORE_FILE"' EXIT
          printf '%s' "$ORYN_RELEASE_KEYSTORE_B64" | base64 --decode > "$ORYN_RELEASE_KEYSTORE_FILE"
          unset ORYN_RELEASE_KEYSTORE_B64
          bash scripts/sign-production-apk.sh
      - name: Record source provenance
        run: |
          git rev-parse HEAD > artifacts/production-source-commit.txt
          (cd artifacts && sha256sum oryn-production.apk > PRODUCTION_SHA256SUMS && sha256sum --check PRODUCTION_SHA256SUMS)
      - name: Upload verified shell APK (not a public release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oryn-production-shell-${{ github.run_number }}-${{ github.sha }}
          path: |
            spikes/android-feasibility/artifacts/oryn-production.apk
            spikes/android-feasibility/artifacts/production-apk.sha256
            spikes/android-feasibility/artifacts/PRODUCTION_SHA256SUMS
            spikes/android-feasibility/artifacts/production-source-commit.txt
            spikes/android-feasibility/artifacts/production-apk-signature.txt
            spikes/android-feasibility/artifacts/production-apk-badging.txt
            spikes/android-feasibility/artifacts/production-apk-permissions.txt
          if-no-files-found: error
          retention-days: 7
